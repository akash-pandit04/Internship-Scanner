name: Scan Internships (CI/CD Pipeline)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest playwright

      - name: Software Testing (PyTest)
        run: |
          pytest tests/

      - name: Run OOP Scanner & Aggregator
        run: |
          python scan.py

      - name: Commit and Push Data
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add docs/data/jobs.json
          git commit -m "chore: Update Internship Data [skip ci]" || echo "No changes to commit"
          git push
