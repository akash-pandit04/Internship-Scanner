<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Internship Scanner</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">Internship Scanner</div>
  <div class="meta-info">
    <span id="update-status">Loading dataset...</span>
  </div>
</header>

<main class="container">
  
  <section class="controls" aria-label="Search and filter">
    <div class="search-bar">
      <label for="f-search" class="sr-only">Search</label>
      <input id="f-search" type="search" placeholder="Search title, company, or skills...">
    </div>
    
    <div class="filters">
      <div class="filter-group">
        <label for="f-cat">Category</label>
        <select id="f-cat">
          <option value="">All Categories</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label for="f-remote">Location</label>
        <select id="f-remote">
          <option value="all">All Locations</option>
          <option value="remote">Remote Only</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label for="f-sort">Sort By</label>
        <select id="f-sort">
          <option value="newest">Newest</option>
          <option value="relevance" selected>Highest Relevance</option>
          <option value="company">Company A-Z</option>
        </select>
      </div>
      
      <div class="filter-actions">
        <button id="btn-clear-filters" class="btn-secondary">Clear Filters</button>
      </div>
    </div>
  </section>
  
  <section class="results-header" aria-label="Results count">
    <h1 class="results-title">Available Internships</h1>
    <span id="results-count" class="badge">0</span>
  </section>
  
  <section id="results-container" class="cards-grid" aria-label="Internship listings">
    <!-- Cards will be injected here -->
  </section>
  
  <div id="empty-state" class="empty-state" hidden>
    <h2>No internships match your filters.</h2>
    <p>Try adjusting your search criteria or clearing filters.</p>
    <button id="btn-empty-clear" class="btn-primary">Clear Filters</button>
  </div>
  
  <div id="error-state" class="error-state" hidden>
    <h2>Unable to load internship dataset.</h2>
    <p>The dataset might be unavailable or regenerating.</p>
  </div>
  
</main>

<script src="app.js"></script>
</body>
</html>
