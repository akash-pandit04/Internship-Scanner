<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSE Internship Scanner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🚀 Global CSE Internship Scanner</h1>
    <p>Real-time aggregation of Software, Data, and Engineering Internships.</p>
    
    <div class="controls">
      <div class="filters" id="category-filters">
        <button class="filter-btn active" data-category="All">All Internships</button>
        <button class="filter-btn" data-category="Software Engineering">Software</button>
        <button class="filter-btn" data-category="Data & AI">Data & AI</button>
        <button class="filter-btn" data-category="Cloud/DevOps">Cloud/DevOps</button>
        <button class="filter-btn" data-category="Cybersecurity">Cybersecurity</button>
      </div>
      <div class="sort">
        <label for="sort-select">Sort By:</label>
        <select id="sort-select">
          <option value="recent">Most Recent</option>
          <option value="score">Highest Match</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <div id="job-list" class="job-grid">
      <!-- Jobs injected via app.js -->
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
